<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<!-- 'unsafe-inline' for styles: the renderer colours player chips and chat
	     names with style attributes in generated HTML -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
	<title>Ancient Bolo Log Viewer</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="layout">
		<div id="main">
			<canvas id="view"></canvas>
			<div id="coordinateDebug" hidden>
				<div>tile <span id="coordinateTile"></span></div>
				<div>pixel <span id="coordinatePixel"></span></div>
			</div>
			<div id="dropHint">
				<div>
					<h1>Ancient Bolo Log Viewer</h1>
					<p>Open a Bolo game log (File → Open, or drop it here).</p>
				</div>
			</div>
			<div id="transport">
				<button id="playBtn" title="Play / pause (space)">▶</button>
				<span id="timeLabel">0:00 / 0:00</span>
				<input id="seek" type="range" min="0" max="1000" value="0" step="1">
				<select id="speed" title="Playback speed">
					<option value="0.5">0.5×</option>
					<option value="1" selected>1×</option>
					<option value="1.5">1.5×</option>
					<option value="2">2×</option>
					<option value="3">3×</option>
					<option value="4">4×</option>
					<option value="6">6×</option>
					<option value="8">8×</option>
					<option value="12">12×</option>
					<option value="16">16×</option>
					<option value="24">24×</option>
					<option value="32">32×</option>
					<option value="48">48×</option>
					<option value="64">64×</option>
				</select>
				<select id="viewpoint" title="Player used for friendly colours and player lock"></select>
				<span id="zoomLabel"></span>
			</div>
		</div>
		<div id="sidebar">
			<div class="panel" id="gamePanel">
				<h2 id="mapName">No log loaded</h2>
				<div id="gameMeta" class="hint"></div>
				<div id="networkMeta" class="hint"></div>
				<div id="recorderMeta" class="hint"></div>
			</div>
			<div class="panel">
				<h2>Players</h2>
				<div id="players"></div>
			</div>
			<div class="panel" id="chatPanel">
				<h2>Message wire</h2>
				<div id="chat"></div>
			</div>
		</div>
	</div>
	<div id="exportSetup" class="hidden">
		<div id="exportSetupBox">
			<h1>Export video</h1>
			<div id="exportSetupSummary" class="hint"></div>
			<div id="exportSetupCamera" class="hint"></div>
			<div class="exportRow">
				<label for="exportRes">Canvas size</label>
				<select id="exportRes">
					<option value="1280x720">1280 × 720</option>
					<option value="1920x1080">1920 × 1080</option>
					<option value="2560x1440">2560 × 1440</option>
				</select>
			</div>
			<div class="exportRow">
				<label for="exportFps">Frame rate</label>
				<select id="exportFps">
					<option value="30">30 fps</option>
					<option value="60">60 fps</option>
				</select>
			</div>
			<div class="exportRow">
				<label for="exportSpeed">Speed</label>
				<select id="exportSpeed">
					<option value="0.5">0.5×</option>
					<option value="1">1×</option>
					<option value="1.5">1.5×</option>
					<option value="2">2×</option>
					<option value="3">3×</option>
					<option value="4">4×</option>
					<option value="6">6×</option>
					<option value="8">8×</option>
					<option value="12">12×</option>
					<option value="16">16×</option>
					<option value="24">24×</option>
					<option value="32">32×</option>
					<option value="48">48×</option>
					<option value="64">64×</option>
				</select>
			</div>
			<div class="exportRow">
				<label><input type="radio" name="exportMode" id="exportModeQuality"> Constant quality</label>
				<select id="exportQuality">
					<option value="standard">Standard</option>
					<option value="high">High</option>
					<option value="max">Maximum</option>
				</select>
			</div>
			<div class="exportRow">
				<label><input type="radio" name="exportMode" id="exportModeSize"> Target size</label>
				<span class="exportField"><input type="number" id="exportMbMin" min="1" max="1000" step="1"> MB per minute</span>
			</div>
			<div class="exportRow">
				<label><input type="checkbox" id="exportSidebar"> Include sidebar</label>
			</div>
			<div id="exportSetupEstimate" class="hint"></div>
			<div id="exportSetupWarning" class="hidden">Camera is locked to a player: the constant scrolling makes constant-quality files much larger.</div>
			<div class="exportButtons">
				<button id="exportSetupCancel">Cancel</button>
				<button id="exportSetupOk">Export…</button>
			</div>
		</div>
	</div>
	<div id="exportOverlay" class="hidden">
		<div id="exportBox">
			<h1>Exporting video…</h1>
			<div id="exportBar"><div id="exportBarFill"></div></div>
			<div id="exportLabel" class="hint"></div>
			<button id="exportCancel">Cancel</button>
		</div>
	</div>
	<input type="file" id="filePick" hidden>
	<script src="format.js"></script>
	<script src="sprites.js"></script>
	<script src="logparse.js"></script>
	<script src="network.js"></script>
	<script src="pillbox_shell_orbits.js"></script>
	<script src="motion.js"></script>
	<script src="game.js"></script>
	<script src="webm.js"></script>
	<script src="renderer.js"></script>
	<script src="video.js"></script>
</body>
</html>
