<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<!-- 'unsafe-inline' for styles: the renderer colours player chips and chat
	     names with style attributes in generated HTML -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
	<title>Ancient Bolo Log Viewer</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="layout">
		<div id="main">
			<canvas id="view"></canvas>
			<div id="dropHint">
				<div>
					<h1>Ancient Bolo Log Viewer</h1>
					<p>Open a Bolo game log (File → Open, or drop it here).</p>
				</div>
			</div>
			<div id="transport">
				<button id="playBtn" title="Play / pause (space)">▶</button>
				<span id="timeLabel">0:00 / 0:00</span>
				<input id="seek" type="range" min="0" max="1000" value="0" step="1">
				<select id="speed" title="Playback speed">
					<option value="0.5">0.5×</option>
					<option value="1" selected>1×</option>
					<option value="2">2×</option>
					<option value="4">4×</option>
					<option value="8">8×</option>
					<option value="16">16×</option>
					<option value="50">50×</option>
				</select>
				<select id="viewpoint" title="Whose side is drawn as friendly"></select>
				<span id="zoomLabel"></span>
			</div>
		</div>
		<div id="sidebar">
			<div class="panel" id="gamePanel">
				<h2 id="mapName">No log loaded</h2>
				<div id="gameMeta" class="hint"></div>
			</div>
			<div class="panel">
				<h2>Players</h2>
				<div id="players"></div>
			</div>
			<div class="panel" id="chatPanel">
				<h2>Message wire</h2>
				<div id="chat"></div>
			</div>
		</div>
	</div>
	<input type="file" id="filePick" hidden>
	<script src="format.js"></script>
	<script src="sprites.js"></script>
	<script src="logparse.js"></script>
	<script src="game.js"></script>
	<script src="renderer.js"></script>
</body>
</html>
