name: Release builds

# Runs only when a release is published (drafts don't count until you hit
# "Publish release"), builds the Windows, Linux, and Mac apps from the tagged
# commit, and attaches the zips to that release. Ordinary pushes to main never
# trigger it.
#
# It can also be run by hand from the Actions tab: give it an existing release
# tag to build and attach assets for, or leave the tag blank to just build and
# get the zips as a workflow artifact.
#
# Everything runs on one macOS runner: the Mac builds need codesign, while the
# Windows and Linux "builds" are just file assembly that works anywhere.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach assets to (e.g. v1.1.1); leave blank to only build"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # needed to upload assets to the release
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }} # build the tagged commit, not whatever main has moved on to

      - name: Check the tag matches the viewer version
        if: env.RELEASE_TAG != ''
        working-directory: viewer
        run: |
          version="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match viewer/package.json version ${version}; refusing to attach mismatched assets."
            exit 1
          fi

      - name: Download Electron
        working-directory: viewer
        run: |
          version="$(python3 -c "import re; print(re.search(r'ELECTRON_VERSION = \"(.+?)\"', open('builder.py').read()).group(1))")"
          echo "Electron v${version}"
          mkdir -p electron_zipped
          for asset in win32-x64 linux-x64 darwin-arm64 darwin-x64; do
            curl -fsSL --retry 4 -o "electron_zipped/electron-v${version}-${asset}.zip" \
              "https://github.com/electron/electron/releases/download/v${version}/electron-v${version}-${asset}.zip"
          done

      - name: Build
        working-directory: viewer
        env:
          BUILDER_ANY_BRANCH: "1" # actions/checkout leaves a detached HEAD, so builder.py cannot see a branch name
        run: python3 builder.py

      - name: Verify signatures
        working-directory: viewer
        run: |
          for d in dist/*-mac-*/; do
            codesign --verify --deep --strict --verbose=2 "${d}Ancient Bolo Log Viewer.app"
          done

      - name: Zip apps
        working-directory: viewer
        run: |
          for d in dist/*-mac-*/; do
            # ditto, unlike plain zip, preserves the symlinks inside the .app
            (cd "${d}" && ditto -c -k --keepParent "Ancient Bolo Log Viewer.app" "../$(basename "${d}").zip")
          done
          for d in dist/*-windows/ dist/*-linux/; do
            # -y keeps symlinks as symlinks; both keep the executable bit on the linux binary
            (cd dist && zip -qry "$(basename "${d}").zip" "$(basename "${d}")")
          done
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: viewer/dist/*.zip
          if-no-files-found: error

      - name: Attach zips to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" viewer/dist/*.zip --clobber --repo "${GITHUB_REPOSITORY}"
