name: Tauri Windows build

# Builds the Tauri (WebView2) edition of the viewer for Windows on a GitHub
# runner, so nothing needs installing locally: Rust, Node and WebView2 are
# on the runner already, and the Tauri CLI fetches NSIS itself.
#
# Runs when a release is published, attaching the installer and a zip of the
# bare executable to it beside the Electron builds. It can also be run by
# hand from the Actions tab: give it an existing release tag to attach to, or
# leave the tag blank to just build and download the files as a workflow
# artifact.

on:
  push:
    branches: [claude/tauri-windows-app-tbgtz6] # temporary: proves the build on this branch before it reaches main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach assets to (e.g. v1.1.1); leave blank to only build"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to upload assets to the release
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }} # build the tagged commit, not whatever main has moved on to

      - name: Read the viewer version
        id: version
        working-directory: viewer
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the viewer version
        if: env.RELEASE_TAG != ''
        run: |
          if [ "${RELEASE_TAG}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match viewer/package.json version ${{ steps.version.outputs.version }}; refusing to attach mismatched assets."
            exit 1
          fi

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: viewer/tauri

      - name: Build
        working-directory: viewer/tauri
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis

      - name: Collect
        working-directory: viewer/tauri
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp target/release/bundle/nsis/*-setup.exe "dist/ancient-bolo-log-viewer-${VERSION}-windows-tauri-setup.exe"
          mkdir -p "dist/ancient-bolo-log-viewer-${VERSION}-windows-tauri"
          cp target/release/ancient-bolo-log-viewer.exe "dist/ancient-bolo-log-viewer-${VERSION}-windows-tauri/"
          (cd dist && 7z a -tzip "ancient-bolo-log-viewer-${VERSION}-windows-tauri.zip" "ancient-bolo-log-viewer-${VERSION}-windows-tauri" > /dev/null)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            viewer/tauri/dist/*.zip
            viewer/tauri/dist/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" viewer/tauri/dist/*.zip viewer/tauri/dist/*.exe --clobber --repo "${GITHUB_REPOSITORY}"
